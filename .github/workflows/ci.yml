name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    name: ソース・テンプレート検証
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: Rubyを準備
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: ShellCheckを導入
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: 全ソースとテンプレートを検証
        run: ruby test/validate_source_files.rb

  tests:
    name: Ruby・シェルテスト
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: Rubyを準備
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: テスト依存ツールを導入
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Rubyテストを実行
        run: ruby -Itest test/test_mitsubachi_infra.rb

      - name: アップロード観測テストを実行
        run: ruby -Itest test/upload_observability_test.rb

      - name: シェル統合テストを実行
        run: bash test/run_shell_tests.sh

  nginx-validation:
    name: Nginx生成設定検証
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: Rubyを準備
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Nginxを導入
        run: sudo apt-get update && sudo apt-get install --yes nginx

      - name: LAN・公開HTTP・公開HTTPS設定を検証
        run: ruby test/validate_nginx_templates.rb
