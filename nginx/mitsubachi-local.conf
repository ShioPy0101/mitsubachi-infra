server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    client_max_body_size 10G;
    client_body_timeout 3600s;
    send_timeout 3600s;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large uploads should stream to Puma instead of being fully buffered on
        # the root filesystem. Responses remain buffered by default because API
        # JSON responses are small and X-Accel-Redirect downloads are served by
        # the internal Nginx location below.
        proxy_request_buffering off;

        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /internal/storage/drive_items/ {
        internal;
        alias /mnt/external-hdd/mitsubachi/files/drive_items/;

        sendfile on;
        tcp_nopush on;

        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        add_header Content-Type text/plain;
        return 200 "mitsubachi local frontend is not deployed yet\n";
    }
}
